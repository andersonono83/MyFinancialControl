<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Gastos - Finanças</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 12px;
            color: #555;
            font-weight: bold;
            font-size: 14px;
        }
        select, input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            margin-top: 20px;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Novo Lançamento</h2>
        <form id="formGasto">
            
            <label>Tipo:</label>
            <select id="tipo" required>
                <option value="Despesa">Despesa</option>
                <option value="Receita">Receita</option>
            </select>

            <label>Empresa / Estabelecimento:</label>
            <input type="text" id="empresa" placeholder="Ex: Uber, Supermercado Extra" required>

            <label>Categoria:</label>
            <select id="categoria" required>
                <option value="Transporte">Transporte</option>
                <option value="Lazer">Lazer</option>
                <option value="Supermercado">Supermercado</option>
            </select>

            <label>Conta:</label>
            <select id="conta" required>
                <option value="Mercado Pago">Mercado Pago</option>
                <option value="Nubank">Nubank</option>
            </select>

            <label>Forma de Pagamento:</label>
            <select id="forma" required>
                <option value="Crédito">Crédito</option>
                <option value="PIX">PIX</option>
            </select>

            <label>Valor (R$):</label>
            <input type="number" step="0.01" id="valor" placeholder="0.00" required>

            <button type="submit" id="btnSalvar">Salvar na Planilha</button>
        </form>
    </div>

    <script>
        // COLE A SUA URL DO GOOGLE APPS SCRIPT AQUI DENTRO DAS ASPAS:
        const URL_DO_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbz82QhXECwl8A7ES3wW5pzJ9xZOKPO-Ez76ZEfcn8FoJ7sFTt4jYxNXpL17TTIVfIPVdg/exec";

        document.getElementById("formGasto").addEventListener("submit", function(e) {
            e.preventDefault();

            const btn = document.getElementById("btnSalvar");
            btn.innerText = "Salvando...";
            btn.disabled = true;

            // Pega a data atual formatada (DD/MM/AAAA)
            const hoje = new Date();
            const dataFormatada = hoje.toLocaleDateString('pt-BR');

            // Pega o mês e ano atual automaticamente para o "Mês Ref" (Ex: "Setembro/2026")
            const mesRefFormatado = hoje.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });

            const dados = {
                data: dataFormatada,
                mesRef: mesRefFormatado.charAt(0).toUpperCase() + mesRefFormatado.slice(1), // Capitaliza o mês
                empresa: document.getElementById("empresa").value,
                categoria: document.getElementById("categoria").value,
                conta: document.getElementById("conta").value,
                forma: document.getElementById("forma").value,
                valor: document.getElementById("valor").value,
                tipo: document.getElementById("tipo").value
            };

            fetch(URL_DO_APPS_SCRIPT, {
                method: "POST",
                body: JSON.stringify(dados)
            })
            .then(response => response.json())
            .then(data => {
                alert("Salvo com sucesso na planilha!");
                document.getElementById("formGasto").reset();
                btn.innerText = "Salvar na Planilha";
                btn.disabled = false;
            })
            .catch(error => {
                console.error("Erro:", error);
                alert("Erro ao salvar. Verifique a conexão.");
                btn.innerText = "Salvar na Planilha";
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
