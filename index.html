<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Gastos e Receitas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h2, h3 {
            text-align: center;
            color: #333;
            margin-top: 0;
        }
        label {
            display: block;
            margin-top: 10px;
            color: #555;
            font-weight: bold;
            font-size: 14px;
        }
        select, input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            margin-top: 20px;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f8f9fa;
            color: #333;
        }
        .positivo { color: green; font-weight: bold; }
        .negativo { color: red; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Formulário de Lançamento -->
        <div class="card">
            <h2>Novo Lançamento</h2>
            <form id="formGasto">
                <label>Tipo:</label>
                <select id="tipo" required>
                    <option value="Despesa">Despesa</option>
                    <option value="Receita">Receita</option>
                </select>

                <label>Empresa / Estabelecimento:</label>
                <input type="text" id="empresa" placeholder="Ex: Posto, Uber, Salário" required>

                <label>Categoria:</label>
                <select id="categoria" required>
                    <option value="Transporte">Transporte</option>
                    <option value="Lazer">Lazer</option>
                    <option value="Supermercado">Supermercado</option>
                </select>

                <label>Conta:</label>
                <select id="conta" required>
                    <option value="Mercado Pago">Mercado Pago</option>
                    <option value="Nubank">Nubank</option>
                </select>

                <label>Forma de Pagamento:</label>
                <select id="forma" required>
                    <option value="Crédito">Crédito</option>
                    <option value="PIX">PIX</option>
                </select>

                <label>Valor (R$):</label>
                <input type="number" step="0.01" id="valor" placeholder="0.00" required>

                <button type="submit" id="btnSalvar">Salvar na Planilha</button>
            </form>
        </div>

        <!-- Tabela de Resumo por Categoria -->
        <div class="card">
            <h3>Resumo por Categoria</h3>
            <table>
                <thead>
                    <tr>
                        <th>Categoria</th>
                        <th>Receitas</th>
                        <th>Despesas</th>
                        <th>Saldo</th>
                    </tr>
                </thead>
                <tbody id="tabelaResumo">
                    <tr><td colspan="4">Carregando dados...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // COLE A SUA URL DO GOOGLE APPS SCRIPT AQUI DENTRO DAS ASPAS:
        const URL_DO_APPS_SCRIPT = "https://script.google.com/macros/library/d/1sHHqDoRSrp6xyZqfuOxti06nfk8mbqIQPRIQV3s0f20UW4JfeJ-nZ8XH/4";

        window.onload = function() {
            carregarResumo();
        };

        document.getElementById("formGasto").addEventListener("submit", function(e) {
            e.preventDefault();

            const btn = document.getElementById("btnSalvar");
            btn.innerText = "Salvando...";
            btn.disabled = true;

            const hoje = new Date();
            const dataFormatada = hoje.toLocaleDateString('pt-BR');
            const mesRefFormatado = hoje.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });

            const dados = {
                data: dataFormatada,
                mesRef: mesRefFormatado.charAt(0).toUpperCase() + mesRefFormatado.slice(1),
                empresa: document.getElementById("empresa").value,
                categoria: document.getElementById("categoria").value,
                conta: document.getElementById("conta").value,
                forma: document.getElementById("forma").value,
                valor: parseFloat(document.getElementById("valor").value),
                tipo: document.getElementById("tipo").value
            };

            fetch(URL_DO_APPS_SCRIPT, {
                method: "POST",
                body: JSON.stringify(dados)
            })
            .then(response => response.json())
            .then(data => {
                alert("Salvo com sucesso na planilha!");
                document.getElementById("formGasto").reset();
                btn.innerText = "Salvar na Planilha";
                btn.disabled = false;
                carregarResumo();
            })
            .catch(error => {
                console.error("Erro:", error);
                alert("Erro ao salvar. Verifique a conexão.");
                btn.innerText = "Salvar na Planilha";
                btn.disabled = false;
            });
        });

        function carregarResumo() {
            fetch(URL_DO_APPS_SCRIPT)
            .then(response => response.json())
            .then(dados => {
                // Inicializa as categorias padrão fixas para sempre aparecerem na tabela
                let resumo = {
                    "Transporte": { receitas: 0, despesas: 0 },
                    "Lazer": { receitas: 0, despesas: 0 },
                    "Supermercado": { receitas: 0, despesas: 0 }
                };

                // Soma os valores vindos da planilha
                dados.forEach(item => {
                    let cat = item.categoria ? item.categoria.trim() : "Outros";
                    if (!resumo[cat]) {
                        resumo[cat] = { receitas: 0, despesas: 0 };
                    }
                    
                    let val = parseFloat(item.valor) || 0;
                    let tipo = item.tipo ? item.tipo.trim() : "";

                    if (tipo === "Receita") {
                        resumo[cat].receitas += val;
                    } else if (tipo === "Despesa") {
                        resumo[cat].despesas += val;
                    }
                });

                let tbody = document.getElementById("tabelaResumo");
                tbody.innerHTML = "";

                Object.keys(resumo).forEach(cat => {
                    let rec = resumo[cat].receitas;
                    let desp = resumo[cat].despesas;
                    let saldo = rec - desp;

                    let classeSaldo = saldo >= 0 ? "positivo" : "negativo";

                    let linha = `<tr>
                        <td><b>${cat}</b></td>
                        <td style="color: green;">R$ ${rec.toFixed(2)}</td>
                        <td style="color: red;">R$ ${desp.toFixed(2)}</td>
                        <td class="${classeSaldo}">R$ ${saldo.toFixed(2)}</td>
                    </tr>`;
                    tbody.innerHTML += linha;
                });
            })
            .catch(error => {
                console.error("Erro ao carregar resumo:", error);
                document.getElementById("tabelaResumo").innerHTML = "<tr><td colspan='4'>Erro ao carregar dados.</td></tr>";
            });
        }
    </script>
</body>
</html>
