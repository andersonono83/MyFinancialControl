<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Gastos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        label {
            display: block;
            margin-top: 10px;
            color: #555;
            font-weight: bold;
        }
        select, input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            margin-top: 20px;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Novo Lançamento</h2>
        <form id="formGasto">
            <label>Tipo:</label>
            <select id="tipo">
                <option value="Despesa">Despesa</option>
                <option value="Receita">Receita</option>
            </select>

            <label>Categoria:</label>
            <input type="text" id="categoria" placeholder="Ex: Mercado, Aluguel" required>

            <label>Valor (R$):</label>
            <input type="number" step="0.01" id="valor" placeholder="0.00" required>

            <label>Descrição:</label>
            <input type="text" id="descricao" placeholder="Detalhes (opcional)">

            <button type="submit" id="btnSalvar">Salvar na Planilha</button>
        </form>
    </div>

    <script>
        // COLE A SUA URL DO GOOGLE APPS SCRIPT AQUI DENTRO DAS ASPAS:
        const URL_DO_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbz82QhXECwl8A7ES3wW5pzJ9xZOKPO-Ez76ZEfcn8FoJ7sFTt4jYxNXpL17TTIVfIPVdg/exec";

        document.getElementById("formGasto").addEventListener("submit", function(e) {
            e.preventDefault();

            const btn = document.getElementById("btnSalvar");
            btn.innerText = "Salvando...";
            btn.disabled = true;

            const dados = {
                tipo: document.getElementById("tipo").value,
                categoria: document.getElementById("categoria").value,
                valor: document.getElementById("valor").value,
                descricao: document.getElementById("descricao").value
            };

            fetch(URL_DO_APPS_SCRIPT, {
                method: "POST",
                body: JSON.stringify(dados)
            })
            .then(response => response.json())
            .then(data => {
                alert("Salvo com sucesso na planilha!");
                document.getElementById("formGasto").reset();
                btn.innerText = "Salvar na Planilha";
                btn.disabled = false;
            })
            .catch(error => {
                console.error("Erro:", error);
                alert("Erro ao salvar. Verifique a conexão.");
                btn.innerText = "Salvar na Planilha";
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
